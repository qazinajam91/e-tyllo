name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Debug Keystore Location
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Unzip Source Code Safely
      run: |
        # Use quotes around filename to safely handle space and parentheses
        unzip -o "e-tyllo (4).zip" -d extracted_app
        
        # Grant executable permissions to gradlew if exists
        find extracted_app -name "gradlew" -exec chmod +x {} +

    - name: Build APK
      run: |
        # Dynamically locate the directory that contains settings.gradle / settings.gradle.kts
        PROJECT_ROOT=$(find extracted_app -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
        
        echo "Root Project Directory found at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"

        # Check if gradlew exists, otherwise use global gradle
        if [ -f "./gradlew" ]; then
          echo "Building with Gradle Wrapper..."
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          echo "Building with Global Gradle..."
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Etyllo-Expense-APK
        path: extracted_app/**/build/outputs/apk/debug/*.apk
        
