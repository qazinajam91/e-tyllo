name: Build E Tyllo Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Unzip Source Code Safely
      run: |
        # Safely unzip using quotes for space and brackets in filename
        unzip -o "e-tyllo (4).zip" -d extracted_app

    - name: Generate Keystore for Signing
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # Locate project root directory dynamically
        PROJECT_ROOT=$(find extracted_app -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
        
        # Place keystore in project root and app directory to satisfy any build.gradle config
        cp ~/.android/debug.keystore "$PROJECT_ROOT/debug.keystore"
        mkdir -p "$PROJECT_ROOT/app"
        cp ~/.android/debug.keystore "$PROJECT_ROOT/app/debug.keystore"

    - name: Setup Gradle 8.7 & Build APK
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.7'
        arguments: |
          assembleDebug 
          --no-daemon 
          --stacktrace 
          -Pandroid.experimental.artificiallyEnableGms=true
        build-root-directory: extracted_app

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: E-Tyllo-Debug-APK
        path: extracted_app/**/build/outputs/apk/debug/*.apk
        
