name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and unzip source code
        run: |
          set -e
          PREFERRED="e-tyllo (3).zip"
          if [ -f "$PREFERRED" ]; then
            ZIP_FILE="$PREFERRED"
          else
            ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | sort | tail -n 1)
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in repository root."
            exit 1
          fi
          echo "Using zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app

      - name: Locate project root
        id: locate
        run: |
          set -e
          PROJECT_ROOT=$(find extracted_app -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find settings.gradle(.kts) inside the extracted zip. Check the zip structure."
            exit 1
          fi
          echo "Root Project Directory found at: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify required config files (google-services.json, local.properties)
        run: |
          ROOT="${{ steps.locate.outputs.project_root }}"
          if ! find "$ROOT" -iname "google-services.json" | grep -q .; then
            echo "::warning::google-services.json not found anywhere in the project. Since this app uses Firebase, the build WILL fail at the Google Services Gradle plugin step unless this file is added to the app/ module folder before zipping."
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$ROOT/local.properties"
          cat "$ROOT/local.properties"

      # This project's build.gradle.kts / libs.versions.toml were inspected
      # directly. Confirmed facts (not guesses):
      #   - AGP version: 9.1.1 (has BUILT-IN Kotlin support, no separate
      #     org.jetbrains.kotlin.android plugin needed)
      #   - Project's declared Kotlin version: 2.2.10 — this matches AGP
      #     9.1.x's own bundled/tested Kotlin version exactly.
      #   - The project's own Gradle build reported: "Minimum supported
      #     Gradle version is 9.3.1."
      # Using a much newer Gradle (e.g. 9.7.0) pulls in a different embedded
      # Kotlin and breaks the Compose compiler plugin. Gradle 9.3.1 is the
      # correct, tested pairing for this exact project — not a guess.
      - name: Ensure Gradle wrapper exists
        run: |
          set -e
          ROOT="${{ steps.locate.outputs.project_root }}"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            echo "gradlew already present in zip."
            chmod +x ./gradlew
            exit 0
          fi

          GRADLE_VERSION="9.3.1"
          echo "Generating Gradle wrapper (version $GRADLE_VERSION)..."
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x ./gradlew

      - name: Generate debug keystore
        run: |
          set -e
          ROOT="${{ steps.locate.outputs.project_root }}"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # The project's build.gradle.kts looks for debug.keystore at the
          # project root (relative path). Place a copy there so
          # ':app:validateSigningDebug' finds it.
          cp ~/.android/debug.keystore "$ROOT/debug.keystore"
          cp ~/.android/debug.keystore "$ROOT/app/debug.keystore" 2>/dev/null || true

      - name: Build APK with the project's own Gradle wrapper
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Etyllo-Expense-APK
          path: ${{ steps.locate.outputs.project_root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
