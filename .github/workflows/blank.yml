Name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Debug Keystore Location
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Unzip Source Code & Fix Executable Permissions
      run: |
        unzip -o "e-tyllo (4).zip" -d extracted_app
        # Make gradlew executable across any extracted folder structure
        find extracted_app -name "gradlew" -exec chmod +x {} +

    - name: Build APK with Gradle Wrapper
      run: |
        # Locate the exact directory containing gradlew wrapper
        GRADLE_DIR=$(find extracted_app -name "gradlew" -exec dirname {} \; | head -n 1)
        cd "$GRADLE_DIR"
        
        # Use project wrapper instead of global system gradle
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Etyllo-Expense-APK
        path: extracted_app/**/build/outputs/apk/debug/*.apk
        name: Etyllo-Expense-APK  
        path: extracted_app/app/build/outputs/apk/debug/*.apk
