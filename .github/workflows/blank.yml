name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip source code & Generate Keystore
      run: |
        unzip -o "e-tyllo (4).zip" -d extracted_app
        
        # Generate missing debug.keystore automatically
        keytool -genkey -v -keystore extracted_app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build APK with Gradle
      run: |
        cd extracted_app
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Etyllo-Expense-APK
        path: extracted_app/app/build/outputs/apk/debug/*.apk
