name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Do NOT force a specific Gradle version here — mismatching the
      # Gradle version against the project's Android Gradle Plugin (AGP)
      # version is one of the most common causes of build failures.
      # We use the project's OWN gradlew (and its own gradle-wrapper
      # .properties version) instead.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip source code
        run: |
          set -e
          ZIP_FILE="e-tyllo (6).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::'$ZIP_FILE' not found in repository root. Update the ZIP_FILE variable in this step if you renamed/re-uploaded the zip."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted_app

      - name: Locate project root
        id: locate
        run: |
          set -e
          PROJECT_ROOT=$(find extracted_app -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find settings.gradle(.kts) inside the extracted zip. Check the zip structure."
            exit 1
          fi
          echo "Root Project Directory found at: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify required config files (google-services.json, local.properties)
        run: |
          ROOT="${{ steps.locate.outputs.project_root }}"
          if ! find "$ROOT" -iname "google-services.json" | grep -q .; then
            echo "::warning::google-services.json not found anywhere in the project. Since this app uses Firebase, the build WILL fail at the Google Services Gradle plugin step unless this file is added to the app/ module folder before zipping."
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$ROOT/local.properties"
          cat "$ROOT/local.properties"

      # Google AI Studio's exported zip usually contains ONLY source files —
      # it does not include the gradlew wrapper scripts/jar. Instead of
      # failing, generate the wrapper here using the runner's system Gradle.
      # If the project already shipped gradle-wrapper.properties, we read the
      # intended Gradle version from it so we don't create a mismatch with
      # the project's Android Gradle Plugin (AGP) version.
      - name: Ensure Gradle wrapper exists
        run: |
          set -e
          ROOT="${{ steps.locate.outputs.project_root }}"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            echo "gradlew already present in zip."
            chmod +x ./gradlew
            exit 0
          fi

          # Default to the SAME version as the system Gradle already
          # installed on this runner (it's recent and known to work here),
          # instead of an old hardcoded version. This avoids
          # "Minimum supported Gradle version is X, Current version is Y"
          # errors when the project uses a newer Android Gradle Plugin (AGP).
          GRADLE_VERSION=$(gradle --version | grep -oP '^Gradle \K[0-9]+\.[0-9]+(\.[0-9]+)?')

          # If the zip DID ship a gradle-wrapper.properties, consider its
          # version too — but only use it if it's NOT older than the
          # system Gradle version, so a stale properties file can't force
          # an incompatible low version.
          PROPS_FILE=$(find . -maxdepth 3 -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$PROPS_FILE" ]; then
            DETECTED=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?' "$PROPS_FILE" || true)
            if [ -n "$DETECTED" ]; then
              HIGHER=$(printf '%s\n%s\n' "$DETECTED" "$GRADLE_VERSION" | sort -V | tail -n 1)
              GRADLE_VERSION="$HIGHER"
            fi
          fi

          echo "Generating Gradle wrapper (version $GRADLE_VERSION)..."
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x ./gradlew

      - name: Build APK with the project's own Gradle wrapper
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Etyllo-Expense-APK
          path: ${{ steps.locate.outputs.project_root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
